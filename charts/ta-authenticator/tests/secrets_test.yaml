---
suite: secrets and service account
templates:
- secret.yaml
- secret-ssh-key.yaml
- serviceaccount.yaml
release:
  namespace: fragalysis
tests:
- it: creates the service account
  template: serviceaccount.yaml
  asserts:
  - isKind:
      of: ServiceAccount
  - equal:
      path: metadata.name
      value: ta-authenticator
  - equal:
      path: metadata.namespace
      value: fragalysis

- it: writes the keys
  template: secret.yaml
  set:
    queryKey: query-key
    statsKey: stats-key
  asserts:
  - equal:
      path: metadata.name
      value: keys
  - equal:
      path: stringData
      value:
        query_key: query-key
        stats_key: stats-key

- it: has no private key by default
  template: secret-ssh-key.yaml
  asserts:
  - hasDocuments:
      count: 0

- it: holds the private key in a secret
  template: secret-ssh-key.yaml
  set:
    ssh.privateKey: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      -----END OPENSSH PRIVATE KEY-----
  asserts:
  - isKind:
      of: Secret
  - equal:
      path: metadata.name
      value: ssh-key
  - equal:
      path: stringData["fragalysis-stack-ssh-key"]
      value: |
        -----BEGIN OPENSSH PRIVATE KEY-----
        -----END OPENSSH PRIVATE KEY-----
