---
suite: secrets
templates:
- secret-backup-rclone.yaml
- secret-backup-rsync.yaml
- secret-database.yaml
- secret-django.yaml
- secret-xchem.yaml
release:
  namespace: fragalysis
set:
  stack.image.tag: 2026.09.1
tests:

# Secrets written once --------------------------------------------------------

- it: generates new database passwords
  template: secret-database.yaml
  asserts:
  - equal:
      path: metadata.name
      value: database
  - equal:
      path: metadata.annotations["helm.sh/resource-policy"]
      value: keep
  - equal:
      path: stringData.host
      value: database.fragalysis.svc
  - equal:
      path: stringData.port
      value: "5432"
  - matchRegex:
      path: stringData.root_password
      pattern: ^[A-Za-z]{12}$
  - matchRegex:
      path: stringData.user_password
      pattern: ^[A-Za-z]{10}$

- it: never rewrites an existing database secret
  template: secret-database.yaml
  kubernetesProvider:
    scheme:
      v1/Secret:
        gvr:
          version: v1
          resource: secrets
        namespaced: true
    objects:
    - kind: Secret
      apiVersion: v1
      metadata:
        name: database
        namespace: fragalysis
      data:
        host: ZGF0YWJhc2UuZnJhZ2FseXNpcy5zdmM=
        port: NTQzMg==
        root_password: ZXhpc3Rpbmdyb290
        user_password: ZXhpc3R1c2Vy
  asserts:
  - equal:
      path: data
      value:
        host: ZGF0YWJhc2UuZnJhZ2FseXNpcy5zdmM=
        port: NTQzMg==
        root_password: ZXhpc3Rpbmdyb290
        user_password: ZXhpc3R1c2Vy
  - notExists:
      path: stringData

- it: has no database secret for an external database
  template: secret-database.yaml
  set:
    database.host: db.example.com
  asserts:
  - hasDocuments:
      count: 0

- it: generates new django secrets
  template: secret-django.yaml
  asserts:
  - equal:
      path: metadata.name
      value: django
  - matchRegex:
      path: stringData.secret_key
      pattern: ^[A-Za-z]{50}$
  - matchRegex:
      path: stringData.superuser_password
      pattern: ^[A-Za-z]{22}$

- it: never rewrites an existing django secret
  template: secret-django.yaml
  kubernetesProvider:
    scheme:
      v1/Secret:
        gvr:
          version: v1
          resource: secrets
        namespaced: true
    objects:
    - kind: Secret
      apiVersion: v1
      metadata:
        name: django
        namespace: fragalysis
      data:
        secret_key: ZXhpc3RpbmdrZXk=
        superuser_password: ZXhpc3RpbmdwYXNz
  asserts:
  - equal:
      path: data
      value:
        secret_key: ZXhpc3RpbmdrZXk=
        superuser_password: ZXhpc3RpbmdwYXNz
  - notExists:
      path: stringData

- it: has no django secret when the stack is not deployed
  template: secret-django.yaml
  set:
    stack.deploy: false
  asserts:
  - hasDocuments:
      count: 0

# Secrets from values ---------------------------------------------------------

- it: has no optional secrets by default
  template: secret-xchem.yaml
  asserts:
  - hasDocuments:
      count: 0

- it: writes the xchem secret when the xchem host is set
  template: secret-xchem.yaml
  set:
    xchem.host: xchem.example.com
    xchem.port: 5432
    xchem.name: xchem
    xchem.user: xchem-user
    xchem.password: xchem-pass
  asserts:
  - equal:
      path: stringData
      value:
        host: xchem.example.com
        port: "5432"
        name: xchem
        user: xchem-user
        password: xchem-pass

- it: has no rsync secret by default
  template: secret-backup-rsync.yaml
  asserts:
  - hasDocuments:
      count: 0

- it: writes the rsync secret when rsync is enabled
  template: secret-backup-rsync.yaml
  set:
    backups.database.rsync.enabled: true
    backups.database.rsync.host: rsync.example.com
    backups.database.rsync.path: /backups
    backups.database.rsync.user: rsync-user
    backups.database.rsync.pass: rsync-pass
  asserts:
  - equal:
      path: metadata.name
      value: backup-rsync
  - equal:
      path: stringData
      value:
        host: rsync.example.com
        path: /backups
        user: rsync-user
        pass: rsync-pass

- it: has no rclone secret by default
  template: secret-backup-rclone.yaml
  asserts:
  - hasDocuments:
      count: 0

- it: writes the rclone secret for a database bucket
  template: secret-backup-rclone.yaml
  set:
    backups.database.rcloneBucketAndPath: bucket/path
    backups.rclone.s3AccessKeyId: key-id
  asserts:
  - equal:
      path: metadata.name
      value: backup-rclone
  - equal:
      path: stringData.s3_access_key_id
      value: key-id

- it: writes the rclone secret for a media bucket
  template: secret-backup-rclone.yaml
  set:
    backups.media.rcloneBucket: bucket
  asserts:
  - hasDocuments:
      count: 1
