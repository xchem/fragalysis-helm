---
suite: beat Deployment
templates:
- deployment-beat.yaml
release:
  namespace: fragalysis
set:
  stack.image.tag: 2026.09.1
tests:
- it: is deployed with a fixed name
  asserts:
  - isKind:
      of: Deployment
  - equal:
      path: metadata.name
      value: beat
  - equal:
      path: metadata.namespace
      value: fragalysis
  - equal:
      path: spec.selector.matchLabels
      value:
        name: beat
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: CONTAINER_ROLE
        value: beat
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: POSTGRESQL_HOST
        value: pgbouncer

- it: is not deployed when disabled
  set:
    beat.enabled: false
  asserts:
  - hasDocuments:
      count: 0

- it: is not deployed when the stack is not deployed
  set:
    stack.deploy: false
  asserts:
  - hasDocuments:
      count: 0
