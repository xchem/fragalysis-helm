{{- if not .Values.database.host }}
{{- /*
Written once. The passwords are generated when the secret is first
written. If it already exists its values are preserved - it's too
complicated to change the root password of an initialised database.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "database" }}
---
kind: Secret
apiVersion: v1
metadata:
  name: database
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fragalysis-stack.labels" . | nindent 4 }}
  annotations:
    # Retained with the database volume, whose database it unlocks.
    helm.sh/resource-policy: keep
{{- if $existing }}
data:
  {{- toYaml $existing.data | nindent 2 }}
{{- else }}
stringData:
  host: database.{{ .Release.Namespace }}.svc
  port: "5432"
  root_password: {{ randAlpha 12 | quote }}
  user_password: {{ randAlpha 10 | quote }}
{{- end }}
{{- end }}
