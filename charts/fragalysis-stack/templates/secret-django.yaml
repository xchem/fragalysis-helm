{{- if .Values.stack.deploy }}
{{- /*
Written once. The secret values are generated when the secret is first
written. If it already exists its values are preserved - rewriting it would
rotate the live django credentials.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "django" }}
---
kind: Secret
apiVersion: v1
metadata:
  name: django
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fragalysis-stack.labels" . | nindent 4 }}
{{- if $existing }}
data:
  {{- toYaml $existing.data | nindent 2 }}
{{- else }}
stringData:
  secret_key: {{ randAlpha 50 | quote }}
  superuser_password: {{ randAlpha 22 | quote }}
{{- end }}
{{- end }}
