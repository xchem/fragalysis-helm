{{- if and .Values.stack.deploy .Values.redis.volume.enabled }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fragalysis-stack.labels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  {{- /* A blank class uses the cluster default ('' would disable provisioning) */}}
  {{- with trim .Values.redis.volume.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.volume.size | quote }}
{{- end }}
